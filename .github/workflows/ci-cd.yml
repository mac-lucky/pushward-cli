name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests and analysis on every push and PR. A v* tag also publishes the image
  # (the runtime of the GitHub Action) and creates the GitHub Release with the
  # notes and the SBOM; the two jobs below add the binaries to it.
  ci-cd:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/go-cicd-reusable.yml@master
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    with:
      app_name: "pushward-cli"
      ghcr_image: "ghcr.io/mac-lucky/pushward-cli"
      dockerhub_image: "maclucky/pushward-cli"
      main_branch: "main"
      enable_go_tests: true
      go_test_args: "-race"
      # A one-shot client: there is no server to health-check.
      enable_container_tests: false

  goreleaser:
    name: Binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci-cd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same resolution as the reusable: the go.mod minor, newest patch.
      - name: Go version
        id: go
        run: echo "version=$(grep '^go ' go.mod | cut -d' ' -f2 | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
          cache: false

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Opens a PR in mac-lucky/homebrew-tap moving the formula to this tag's
  # source tarball. The tap builds bottles on the PR and publishes them once
  # its tests pass. Prereleases skip this, and a tag that is not semver has
  # already failed ci-cd. This job and the next write to the other repo with
  # a token of the mac-lucky-ci GitHub App, scoped to that one repo.
  homebrew:
    name: Homebrew formula
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: ci-cd
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: App token for homebrew-tap
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mac-lucky
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Bump the formula
        uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: pushward
          homebrew-tap: mac-lucky/homebrew-tap
          # The tap itself: an installation token reports no push permission
          # on it, and without push-to the action would try to fork it.
          push-to: mac-lucky/homebrew-tap
          create-pullrequest: true
          commit-message: |
            pushward {{version}}

            Bumped by the pushward-cli release workflow.
        env:
          COMMITTER_TOKEN: ${{ steps.app.outputs.token }}

  # Copies action/action.yml into mac-lucky/pushward-action with the new image
  # pinned, then tags and releases it there, moving the major tag (v1) along.
  # Prereleases stop before this.
  bump-action:
    name: Release pushward-action
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: ci-cd
    runs-on: ubuntu-latest
    permissions: {}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Action users pull the image without credentials. This runner has none
      # either, so a private package fails here instead of in their workflows.
      - name: Pull the image anonymously
        run: docker run --rm "ghcr.io/mac-lucky/pushward-cli:${TAG#v}" version

      - name: Checkout the action manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: cli
          sparse-checkout: action
          persist-credentials: false

      - name: App token for pushward-action
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mac-lucky
          repositories: pushward-action
          permission-contents: write
          # GitHub can refuse an App's ref update over the workflow files
          # the commit carries unless the token may write workflows.
          permission-workflows: write

      - name: Checkout pushward-action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mac-lucky/pushward-action
          path: pushward-action
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          # The pushes below reuse the persisted token.
          persist-credentials: true # zizmor: ignore[artipacked] the job uploads no artifacts

      - name: Copy, pin, tag and release
        working-directory: pushward-action
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          major="${VERSION%%.*}"
          cp ../cli/action/action.yml action.yml
          sed -i -E "s#(docker://ghcr\.io/mac-lucky/pushward-cli:)[^'\"]+#\1${VERSION}#" action.yml
          grep -q "docker://ghcr.io/mac-lucky/pushward-cli:${VERSION}'" action.yml
          git config user.name mac-lucky
          git config user.email 44085390+mac-lucky@users.noreply.github.com
          if ! git diff --quiet; then
            git commit -am "chore(action): sync with pushward-cli ${VERSION}"
            git push origin HEAD:main
          fi
          # A re-run finds the version tag in place and only moves the major.
          if ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
          git tag -f "v${major}" "v${VERSION}"
          git push -f origin "v${major}"
          if ! gh release view "v${VERSION}" --repo mac-lucky/pushward-action >/dev/null 2>&1; then
            gh release create "v${VERSION}" --repo mac-lucky/pushward-action --verify-tag \
              --title "v${VERSION}" \
              --notes "Runs pushward-cli ${VERSION}. Changes: https://github.com/mac-lucky/pushward-cli/releases/tag/v${VERSION}"
          fi
