name: E2E

# Runs the published action (mac-lucky/pushward-action@v1) against the
# production API. Manual only: every run pushes to the devices of the key's
# owner. PUSHWARD_E2E_TOKEN is an integration key with the notification,
# activity and widget scopes, its slugs restricted to gha-*.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activity:
    name: activity (${{ matrix.outcome }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        outcome: [success, failure]
    env:
      # The default slug is per job, and every matrix leg is the same job.
      SLUG: gha-e2e-${{ github.run_id }}-${{ strategy.job-index }}
    steps:
      - name: Start
        id: start
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          command: activity start --template steps --step 1/3 --step-labels Build,Test,Deploy
          slug: ${{ env.SLUG }}
          text: Building

      - name: Update
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          command: activity update --step 2/3
          slug: ${{ env.SLUG }}
          text: Testing

      - name: End
        id: end
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          command: activity end
          slug: ${{ env.SLUG }}
          status: ${{ matrix.outcome }}

      - name: Check outputs
        env:
          START_SLUG: ${{ steps.start.outputs.slug }}
          START_STATUS: ${{ steps.start.outputs.status }}
          END_STATUS: ${{ steps.end.outputs.status }}
          END_RESPONSE: ${{ steps.end.outputs.response }}
          OUTCOME: ${{ matrix.outcome }}
        run: |
          set -eu
          text=$(printf '%s' "$END_RESPONSE" | jq -r .content.state)
          want=Success
          [ "$OUTCOME" = success ] || want=Failed
          echo "slug=$START_SLUG start=$START_STATUS end=$END_STATUS text=$text"
          [ "$START_SLUG" = "$SLUG" ]
          [ "$START_STATUS" = ongoing ]
          [ "$END_STATUS" = ended ]
          [ "$text" = "$want" ]

      - name: Delete
        if: always()
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          command: activity delete
          slug: ${{ env.SLUG }}
          fail-on-error: false

  defaults:
    runs-on: ubuntu-latest
    steps:
      - name: Start with the default slug
        id: start
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          command: activity start
          text: Running

      # A job whose start step never ran must still end cleanly.
      - name: End an activity that does not exist
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          command: activity end
          slug: gha-e2e-missing-${{ github.run_id }}
          status: success

      - name: Check outputs
        env:
          SLUG: ${{ steps.start.outputs.slug }}
          WANT: gha-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}-${{ github.job }}
          RESPONSE: ${{ steps.start.outputs.response }}
        run: |
          set -eu
          echo "slug=$SLUG"
          [ "$SLUG" = "$WANT" ]
          [ "$(printf '%s' "$RESPONSE" | jq -r .name)" = "$GITHUB_WORKFLOW" ]

      - name: Delete
        if: always()
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          command: activity delete
          fail-on-error: false

  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        id: notify
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          title: E2E ${{ github.run_id }}
          body: pushward-action notify
          level: passive

      # Nobody answers, so this times out: with fail-on-error off the step
      # passes and still reports the pending answer.
      - name: Ask
        id: ask
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          title: E2E ${{ github.run_id }}
          body: Ignore this one
          level: passive
          actions: |
            ok=OK
            no=No
          wait: 5s
          fail-on-error: false

      - name: Check outputs
        env:
          NOTIFY_ID: ${{ steps.notify.outputs.id }}
          ASK_STATUS: ${{ steps.ask.outputs.status }}
          ASK_ANSWER: ${{ steps.ask.outputs.answer }}
        run: |
          set -eu
          echo "id=$NOTIFY_ID ask=$ASK_STATUS answer=$ASK_ANSWER"
          [ -n "$NOTIFY_ID" ]
          [ "$ASK_STATUS" = pending ]
          [ -z "$ASK_ANSWER" ]

  widget:
    runs-on: ubuntu-latest
    env:
      SLUG: gha-e2e-${{ github.run_id }}
    steps:
      - name: Create
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          command: widget create --template value --value 1 --unit runs
          slug: ${{ env.SLUG }}
          name: E2E

      - name: Update
        id: update
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          command: widget update
          slug: ${{ env.SLUG }}
          fields: content.value=2

      - name: Check outputs
        env:
          RESPONSE: ${{ steps.update.outputs.response }}
        run: |
          set -eu
          [ "$(printf '%s' "$RESPONSE" | jq -r .content.value)" = 2 ]

      - name: Delete
        if: always()
        uses: mac-lucky/pushward-action@638b16f722fa0fba7ed3df3b2b35c83888023826 # v1
        with:
          token: ${{ secrets.PUSHWARD_E2E_TOKEN }}
          command: widget delete
          slug: ${{ env.SLUG }}
          fail-on-error: false
