# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: pushward

builds:
  - main: ./cmd/pushward
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.buildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# The CI/CD workflow's release job already created the release with its notes
# and the SBOM. GoReleaser only adds the archives to it.
changelog:
  disable: true

release:
  mode: keep-existing
  replace_existing_artifacts: true
  prerelease: auto
