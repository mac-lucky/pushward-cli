# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: pushward

builds:
  - main: ./cmd/pushward
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.buildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# The CI/CD workflow's release job already created the release with its notes
# and the SBOM. GoReleaser only adds the archives to it.
changelog:
  disable: true

release:
  mode: keep-existing
  replace_existing_artifacts: true
  prerelease: auto

# bucket/pushward.json in mac-lucky/scoop-bucket, for
# `scoop bucket add maclucky https://github.com/mac-lucky/scoop-bucket`.
# Skipped for a prerelease, and when the workflow got no token for the
# bucket: a release must not fail over it.
scoops:
  - name: pushward
    repository:
      owner: mac-lucky
      name: scoop-bucket
      # Read only when the upload is not skipped, so never unset then.
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    directory: bucket
    homepage: https://github.com/mac-lucky/pushward-cli
    description: Command-line client for PushWard push notifications, Live Activities and widgets
    license: MIT
    commit_author:
      name: mac-lucky
      email: 44085390+mac-lucky@users.noreply.github.com
    commit_msg_template: "pushward {{ .Tag }}"
    skip_upload: '{{ if and (index .Env "SCOOP_BUCKET_TOKEN") (not .Prerelease) }}false{{ else }}true{{ end }}'
