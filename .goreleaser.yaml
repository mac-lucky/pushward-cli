# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: pushward

builds:
  - id: pushward
    main: ./cmd/pushward
    binary: pushward
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.buildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# Optional: signs and notarizes the darwin binaries with quill (it runs on a
# Linux runner) once the MACOS_* secrets exist. Without them the darwin
# binaries ship unsigned; Homebrew formula installs never meet Gatekeeper.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [pushward]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# The CI/CD workflow's release job already created the release with its notes
# and the SBOM. GoReleaser only adds the archives to it.
changelog:
  disable: true

release:
  mode: keep-existing
  replace_existing_artifacts: true
  prerelease: auto
